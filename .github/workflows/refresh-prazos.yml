name: Refresh Legal Deadlines

on:
  schedule:
    # 08:00 America/Sao_Paulo while Brazil is UTC-3.
    - cron: "0 11 * * 1-5"
  workflow_dispatch:

jobs:
  refresh-prazos:
    runs-on: ubuntu-latest
    environment: matrizjuduciaria
    timeout-minutes: 15
    steps:
      - name: Refresh legal deadlines
        env:
          APP_URL: ${{ secrets.APP_URL }}
          JOB_TRIGGER_TOKEN: ${{ secrets.JOB_TRIGGER_TOKEN }}
        run: |
          set -eu
          test -n "$APP_URL"
          test -n "$JOB_TRIGGER_TOKEN"
          curl --fail-with-body --silent --show-error \
            --request POST "$APP_URL/internal/jobs/refresh-prazos" \
            --header "Authorization: Bearer $JOB_TRIGGER_TOKEN" \
            --header "Accept: application/json"
